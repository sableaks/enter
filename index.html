<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{width:350px;background:#1b1b1b;padding:25px;border-radius:12px}h2{margin-top:0}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:0;border-radius:7px;background:#292929;color:#fff}button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}#status,#loginStatus{margin-top:15px}</style>
</head>
<body>
    <div class="box" id="app">
        <h2>Enter Password</h2>
        <input id="password" type="password" placeholder="Password" autocomplete="off">
        <button onclick="login()">LOGIN</button>
        <div id="loginStatus"></div>
    </div>
    <script>
        async function login() {
            const p = document.getElementById("password").value;
            const status = document.getElementById("loginStatus");
            try {
                const res = await fetch("/api/check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: p })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // Inject the protected HTML UI
                    document.getElementById("app").innerHTML = data.html;
                    
                    // Inject and execute the protected JavaScript logic
                    const script = document.createElement("script");
                    script.innerHTML = data.js;
                    document.body.appendChild(script);
                } else {
                    status.textContent = "Incorrect password.";
                }
            } catch (err) {
                status.textContent = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
